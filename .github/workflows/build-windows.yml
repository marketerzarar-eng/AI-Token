name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build .exe with PyInstaller
        run: pyinstaller build/token_auditor.spec --noconfirm --workpath pyinstaller-work --distpath dist
      - name: Zip the build output
        run: Compress-Archive -Path "dist/AI Token Auditor/*" -DestinationPath "AI-Token-Auditor-Windows.zip"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Token-Auditor-Windows
          path: AI-Token-Auditor-Windows.zip
          retention-days: 90
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AI-Token-Auditor-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
